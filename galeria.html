<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galeria Imágenes</title>
    <link rel="stylesheet" href="./estilo.css">
  </head>
  <body>
    <header>Galeria Imagenes - Estaciones</header>
    <div class="barra-menu">
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="galeria.html">Galeria Imágenes</a></li>
            </ul>
        </nav>
    </div>
    <div class="contenedor-global">
       <button id="flecha_izqda" class="flecha">&lt;</button>
    <div class="imagenes">
      <div class="elemento">
        <img src="./images/invierno.jpg" alt="Invierno">
        <p class="nombre">Invierno</p>
      </div>
      <div class="elemento">
        <img src="./images/primavera.jpg" alt="Primavera">
        <p class="nombre">Primavera</p>
      </div>
      <div class="elemento">
        <img src="./images/verano.jpg" alt="Verano">
        <p class="nombre">Verano</p>
      </div>
      <div class="elemento">
        <img src="./images/otoño.jpg" alt="Otoño">
        <p class="nombre">Otoño</p>
      </div> 
    </div>
    <button id="flecha_dcha" class="flecha">&gt;</button>
    </div>
   <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.0.2/jquery.min.js"></script>
    <script>
     $(document).ready(function(){
      $(".elemento").hover(
        function(){
          $(this).find(".nombre").show();
        },
        function(){
          $(this).find(".nombre").hide();
        }
      );
      $("#flecha_izqda").click(function(){
        $(".imagenes").animate({scrollLeft:"-=255"},300);
      });
      $("#flecha_dcha").click(function(){
        $(".imagenes").animate({scrollLeft:"+=255"},300);
      });
     }) 
    </script>
    <footer><strong>Universidad de Alcalá</strong></footer>
  </body>
</html>
